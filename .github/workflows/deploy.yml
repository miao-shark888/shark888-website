name: Build and Deploy to EdgeOne Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ dist 目录未生成，请检查 npm run build 是否成功"
            exit 1
          fi
          echo "✅ dist 目录存在，内容："
          ls -la dist/

      - name: Deploy to EdgeOne Pages
        run: npx edgeone makers deploy ./dist -n ${{ vars.EDGEONE_PROJECT_NAME }} -t ${{ secrets.EDGEONE_API_TOKEN }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
